
<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>Ma routine peau</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#25332d;background:#f7f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:530px;margin:auto;padding:18px 17px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:2px;color:#718278;font-weight:700}h1{font-size:28px;letter-spacing:-.8px;margin:6px 0}h2{font-size:17px;margin:0 0 12px}.sub{color:#718278;font-size:13px}.card{background:#fff;border:1px solid #e7e9e2;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 2px 14px #273d2710}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #e7e9e2;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;max-width:175px;background:none;border:0;color:#78867e;font-size:12px;padding:8px 2px}.nav button.active{color:#27644d;font-weight:800}button{font:inherit;cursor:pointer}.btn{border:1px solid #d9e2d9;border-radius:12px;background:#f4f8f4;color:#27644d;padding:10px 12px;font-weight:650}.btn.primary{background:#27644d;color:white}.btn.warn{color:#8b5d2f;background:#fff9ef;border-color:#efdfc9}.dates{display:flex;align-items:center;justify-content:space-between;gap:7px}.dates h1{font-size:23px;text-align:center}.dates button{min-width:42px}.tag{font-size:11px;border-radius:30px;padding:6px 9px;background:#edf3ec;color:#426951;display:inline-block}.tasks{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e6ebe6;border-radius:13px;min-height:52px;cursor:pointer}.task input{accent-color:#36785c;width:21px;height:21px;flex:none}.task span{font-size:14px;line-height:1.35}.task.checked span{text-decoration:line-through;color:#8b978e}.section-label{font-size:11px;letter-spacing:1.2px;font-weight:800;color:#718278;margin:16px 0 9px}.choice{display:flex;gap:9px}.choice button{flex:1;padding:12px;border-radius:12px;background:white;border:1px solid #dce5dc}.choice button.sel{background:#27644d;color:white;border-color:#27644d}.notice{background:#fff8e9;color:#775b35;padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.5;margin:12px 0}.muted{color:#748079;font-size:12px;line-height:1.5}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays div{text-align:center;color:#8a968e;font-size:11px;padding:7px 0}.day{border:1px solid #e7ece6;background:#fff;border-radius:10px;min-height:54px;padding:5px 1px;text-align:center;color:#304337}.day.today{border:2px solid #2d7456}.day.out{opacity:.22}.day.selected{background:#e8f2e9}.daynum{font-size:12px}.dots{display:flex;gap:3px;justify-content:center;min-height:10px;margin-top:5px}.dot{width:7px;height:7px;border-radius:50%;background:#3878bd}.dot.acne{background:#d87972}.dot.serum{background:#b38c55}.dot.mask{background:#9a78b3}.dot.applied{outline:1.5px solid #27644d;outline-offset:1px}.switch{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #ecf0ea}.switch input{width:22px;height:22px;accent-color:#36785c}.switch strong{font-size:14px}.switch small{display:block;color:#77847b;margin-top:4px;line-height:1.4}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stat{flex:1;text-align:center;background:#f2f7f1;padding:12px;border-radius:13px}.stat b{display:block;font-size:21px;color:#27644d}.stat small{font-size:11px;color:#708074}.hidden{display:none}.footer{font-size:11px;color:#86928a;margin:16px 3px;line-height:1.5}input[type=date]{font:inherit;padding:10px;border:1px solid #dce5dc;border-radius:10px;max-width:100%}</style></head><body><main><header><div><div class="eyebrow">MON CARNET DE SOIN</div><h1>Ma routine peau <span style="font-size:23px">✦</span></h1><div class="sub">Epiduo · SVR · Respire</div></div><div style="font-size:30px">🌿</div></header><div id="today"></div><div id="calendarView" class="hidden"></div><div id="settingsView" class="hidden"></div></main><nav class="nav"><button data-tab="today" class="active">☀️<br>Aujourd'hui</button><button data-tab="calendarView">▦<br>Calendrier</button><button data-tab="settingsView">⚙️<br>Réglages</button></nav><script>
(()=>{'use strict';const START='2026-10-13',END='2027-02-10',KEY='routine-peau-2026-v1';let state={checks:{},acne:{},serum:false,mask:false,skipped:{},extra:{},serumDays:{},maskDays:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const date=(s)=>new Date(s+'T12:00:00');const iso=(d)=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const plus=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return iso(d)};const diff=(s)=>Math.round((date(s)-date(START))/86400000);const inRange=s=>s>=START&&s<=END;const pretty=s=>date(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let selected=inRange(iso(new Date()))?iso(new Date()):START,viewMonth=selected.slice(0,7),tab='today';
function maskScheduled(s){return state.mask&&diff(s)>=14&&diff(s)%14===0}function epiduo(s){if(!inRange(s)||maskScheduled(s)||state.skipped[s])return false;if(state.extra[s])return true;let n=diff(s);if(n<0)return false;if(n<7)return n===0||n===3;if(n<14)return [7,9,12].includes(n);if(n<28)return n%2===0;return true}function serumScheduled(s){if(!state.serum||diff(s)<42||maskScheduled(s)||epiduo(s))return false;let n=diff(s)-42;return n%3===0}function items(s){let a=[];if(s>START){a.push(['am-clean','Nettoyage doux (si nécessaire)'],['sun','Actinica sur peau propre et sèche'],['am-moist','Hydratant après absorption d’Actinica, si besoin'],['zinc','Zinc (dose de l’ordonnance)'])}a.push(['pm-clean','Nettoyage doux du soir']);if(maskScheduled(s))a.push(['mask','Masque Respire : 5 min, puis rincer délicatement']);if(serumScheduled(s))a.push(['serum','SVR Ampoule AZ : fine couche sur peau sèche']);if(epiduo(s))a.push(['pre','Hydratant — 1re couche'],['epi','Epiduo — fine couche sur peau sèche, selon ordonnance'],['post','Hydratant — 2e couche']);else a.push(['pm-moist','Crème hydratante du soir']);return a}function task(s,id,label){let k=s+'|'+id,checked=!!state.checks[k];return `<label class="task ${checked?'checked':''}"><input type="checkbox" data-check="${esc(k)}" ${checked?'checked':''}><span>${esc(label)}</span></label>`}
function renderToday(){let n=diff(selected),ts=items(selected),am=ts.filter(x=>x[0].startsWith('am-')||x[0]==='sun'||x[0]==='zinc'),pm=ts.filter(x=>!am.includes(x));document.querySelector('#today').innerHTML=`<div class="dates"><button class="btn" id="prev" ${selected===START?'disabled':''}>‹</button><div><h1>${esc(pretty(selected))}</h1><div class="sub" style="text-align:center">Semaine ${Math.floor(n/7)+1} · ${n===0?'Début ce soir':n<42?'Adaptation':'Suivi'}</div></div><button class="btn" id="next" ${selected===END?'disabled':''}>›</button></div><div class="row" style="justify-content:center;margin:14px 0"><button class="btn" id="goToday">Revenir à aujourd’hui</button></div>${n===0?'<div class="notice">Début ce soir : la routine du matin commence demain.</div>':''}<div class="card"><h2>☀️ Matin</h2>${am.length?`<div class="tasks">${am.map(x=>task(selected,...x)).join('')}</div>`:'<p class="muted">Pas de routine du matin prévue aujourd’hui.</p>'}</div><div class="card"><h2>🌙 Soir ${epiduo(selected)?'<span class="tag">Epiduo</span>':''}${maskScheduled(selected)?'<span class="tag">Masque</span>':''}${serumScheduled(selected)?'<span class="tag">SVR</span>':''}</h2><div class="tasks">${pm.map(x=>task(selected,...x)).join('')}</div></div><div class="card"><h2>De nouveaux boutons aujourd’hui ?</h2><div class="choice"><button data-acne="yes" class="${state.acne[selected]==='yes'?'sel':''}">Oui</button><button data-acne="no" class="${state.acne[selected]==='no'?'sel':''}">Non</button></div><p class="muted">Laisse vide si tu n’as pas encore observé ta peau.</p></div><div class="card"><h2>Adapter cette journée</h2><div class="row"><button class="btn warn" id="skip">${state.skipped[selected]?'↩ Rétablir Epiduo':'Reporter Epiduo ce soir'}</button>${!epiduo(selected)&&!maskScheduled(selected)?`<button class="btn" id="extra">${state.extra[selected]?'Annuler Epiduo ajouté':'+ Epiduo ce soir'}</button>`:''}</div><p class="muted">Un changement de programme n’est pas un échec. Ne rattrape pas une dose manquée en doublant.</p></div>${n>=42&&!state.serum?'<div class="notice">Le sérum SVR peut être envisagé après adaptation, mais son activation nécessite ton accord et idéalement celui de ta dermatologue.</div>':''}`;document.querySelector('#prev').onclick=()=>{selected=plus(selected,-1);renderToday()};document.querySelector('#next').onclick=()=>{selected=plus(selected,1);renderToday()};document.querySelector('#goToday').onclick=()=>{selected=inRange(iso(new Date()))?iso(new Date()):START;renderToday()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[el.dataset.check]=el.checked;save();renderToday()});document.querySelectorAll('[data-acne]').forEach(el=>el.onclick=()=>{let v=el.dataset.acne;state.acne[selected]=state.acne[selected]===v?null:v;save();renderToday()});document.querySelector('#skip').onclick=()=>{state.skipped[selected]=!state.skipped[selected];if(state.skipped[selected])delete state.extra[selected];save();renderToday()};let ex=document.querySelector('#extra');if(ex)ex.onclick=()=>{state.extra[selected]=!state.extra[selected];if(state.extra[selected])delete state.skipped[selected];save();renderToday()}}
function renderCalendar(){let first=date(viewMonth+'-01'),y=first.getFullYear(),m=first.getMonth(),last=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array.from({length:offset},()=>'<div></div>');for(let day=1;day<=last;day++){let s=`${viewMonth}-${String(day).padStart(2,'0')}`,ok=inRange(s),epi=ok&&epiduo(s),ac=state.acne[s]==='yes';cells.push(`<button class="day ${ok?'':'out'} ${s===iso(new Date())?'today':''} ${s===selected?'selected':''}" data-date="${s}" ${ok?'':'disabled'}><div class="daynum">${day}</div><div class="dots">${epi?`<i class="dot ${state.checks[s+'|epi']?'applied':''}"></i>`:''}${ac?'<i class="dot acne"></i>':''}${maskScheduled(s)?'<i class="dot mask"></i>':''}${serumScheduled(s)?'<i class="dot serum"></i>':''}</div></button>`)}let count=0,done=0,acne=0;for(let s=START;s<=END;s=plus(s,1)){if(s>iso(new Date()))break;if(epiduo(s)){count++;if(state.checks[s+'|epi'])done++}if(state.acne[s]==='yes')acne++}document.querySelector('#calendarView').innerHTML=`<div class="card"><div class="dates"><button class="btn" id="prevMonth">‹</button><h2 style="margin:0;text-transform:capitalize">${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><button class="btn" id="nextMonth">›</button></div><div class="weekdays">${['L','M','M','J','V','S','D'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar">${cells.join('')}</div><div class="row" style="margin-top:16px;font-size:11px;gap:12px"><span>🔵 Epiduo prévu</span><span>🔴 Nouveaux boutons</span><span>🟣 Masque</span><span>🟤 SVR</span></div><p class="muted">Un cercle vert autour du point bleu signifie qu’Epiduo a été coché comme appliqué. Appuie sur une date pour ouvrir sa routine.</p></div><div class="card"><h2>Mon suivi jusqu’à aujourd’hui</h2><div class="row"><div class="stat"><b>${done}/${count}</b><small>Epiduo coché / prévu</small></div><div class="stat"><b>${acne}</b><small>Jours avec nouveaux boutons</small></div></div></div>`;document.querySelector('#prevMonth').onclick=()=>{let d=new Date(y,m-1,1);viewMonth=iso(d).slice(0,7);renderCalendar()};document.querySelector('#nextMonth').onclick=()=>{let d=new Date(y,m+1,1);viewMonth=iso(d).slice(0,7);renderCalendar()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;switchTab('today')})}
function renderSettings(){document.querySelector('#settingsView').innerHTML=`<div class="card"><h2>Programme automatique</h2><p class="muted">Du 13 octobre 2026 au 10 février 2027. Semaine 1 : 2 soirs. Semaine 2 : 3 soirs. Semaines 3–4 : un soir sur deux. À partir de la semaine 5 : objectif quotidien si bien toléré et conforme à l’ordonnance. Tu peux reporter une application depuis la fiche du jour.</p><div class="notice">Ce programme est un repère, pas une prescription. L’augmentation dépend de la tolérance et des consignes de ta dermatologue. Une irritation marquée justifie d’espacer les applications et de demander conseil.</div></div><div class="card"><h2>Soins complémentaires</h2><label class="switch"><span><strong>Masque Respire, tous les 14 jours</strong><small>Proposé dès le jour 15, uniquement si la peau est calme. La soirée masque remplace Epiduo. Ne pas utiliser sur peau irritée.</small></span><input id="maskToggle" type="checkbox" ${state.mask?'checked':''}></label><label class="switch"><span><strong>Activer SVR Ampoule AZ</strong><small>Possible à partir de la semaine 7, uniquement après bonne tolérance et validation de la dermatologue. Proposé un soir sans Epiduo tous les 3 jours ; peut rester absent si Epiduo est quotidien.</small></span><input id="serumToggle" type="checkbox" ${state.serum?'checked':''}></label><p class="muted">Attention : SVR contient 15 % d’acide azélaïque et de l’acide salicylique. Ne pas le superposer automatiquement à Epiduo. Si Epiduo est quotidien, demander à la dermatologue comment intégrer SVR avant de modifier le programme.</p></div><div class="card"><h2>Ordre et précautions</h2><p class="muted"><b>Matin :</b> nettoyage doux si nécessaire → Actinica sur peau propre et sèche → laisser pénétrer → hydratant si besoin ; zinc selon ordonnance. Réappliquer Actinica en cas d’exposition prolongée, de transpiration importante ou après s’être essuyée.</p><p class="muted"><b>Soir Epiduo :</b> nettoyer → sécher → hydratant fin → laisser absorber → Epiduo en couche fine (quantité prescrite, souvent un petit pois pour tout le visage) → hydratant. Éviter yeux, lèvres et muqueuses. Le peroxyde de benzoyle peut décolorer les tissus.</p><p class="muted"><b>Soir masque :</b> nettoyer → masque Respire 5 minutes maximum → rincer → hydrater. Éviter si peau sensibilisée.</p><p class="muted"><b>Grossesse :</b> Epiduo est contre-indiqué pendant la grossesse et en cas de projet de grossesse.</p></div><div class="card"><h2>Sauvegarder mes données</h2><p class="muted">Les données sont enregistrées uniquement sur cet appareil, pour cette adresse web. Effacer les données Safari ou changer d’adresse GitHub Pages peut les faire disparaître.</p><div class="row"><button class="btn primary" id="export">Exporter ma sauvegarde</button><label class="btn">Importer<input id="import" type="file" accept="application/json" style="display:none"></label></div></div><div class="footer">Application personnelle de suivi, non destinée à remplacer l’avis de la dermatologue. Les applications affichées sont indicatives et doivent rester compatibles avec ton ordonnance.</div>`;document.querySelector('#maskToggle').onchange=e=>{state.mask=e.target.checked;save();renderSettings()};document.querySelector('#serumToggle').onchange=e=>{if(e.target.checked&&!confirm('Activer le sérum uniquement si ta peau tolère Epiduo et si la dermatologue a validé son association. Continuer ?')){e.target.checked=false;return}state.serum=e.target.checked;save();renderSettings()};document.querySelector('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'routine-peau',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='sauvegarde-routine-peau.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)};document.querySelector('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.app!=='routine-peau'||!x.state||typeof x.state!=='object')throw Error('Format incorrect');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state={...state,...x.state};save();renderSettings();alert('Sauvegarde importée')}catch(err){alert('Import impossible : '+err.message)}}}
function switchTab(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['today','calendarView','settingsView'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==t));if(t==='today')renderToday();if(t==='calendarView'){viewMonth=selected.slice(0,7);renderCalendar()}if(t==='settingsView')renderSettings();window.scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));switchTab('today');})();
</script></body></html>
